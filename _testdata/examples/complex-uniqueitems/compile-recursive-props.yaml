openapi: 3.0.3
info:
  title: Recursive AdditionalProperties UniqueItems Compile Test
  version: 1.0.0
  description: |
    Objects whose additionalProperties values are unique arrays of the
    object itself, both under a named property and directly at the object
    root. Equality collection must tolerate the recursive type graph without
    dereferencing or rejecting incompletely constructed map items.

paths:
  /nodes:
    post:
      operationId: addNode
      summary: Store a recursive node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursiveNode'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored:
                    type: integer
  /roots:
    post:
      operationId: addRoot
      summary: Store a node whose root additionalProperties reference itself
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursiveRoot'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored:
                    type: integer

components:
  schemas:
    RecursiveNode:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        children:
          type: object
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/RecursiveNode'
        links:
          $ref: '#/components/schemas/LinkMap'
    LinkMap:
      type: object
      description: Named map whose values reference the map itself
      additionalProperties:
        $ref: '#/components/schemas/LinkMap'
    RecursiveRoot:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/RecursiveRoot'
