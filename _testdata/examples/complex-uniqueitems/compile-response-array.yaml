openapi: 3.0.3
info:
  title: Response UniqueItems Array Compile Test
  version: 1.0.0
  description: |
    The only uniqueItems constraint in this document sits on a response body
    array, so equality helpers must be collected from response traversal and
    the generated package must compile.

paths:
  /entries:
    get:
      operationId: listEntries
      summary: Response body array with unique inline object items
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  type: object
                  required:
                    - key
                  properties:
                    key:
                      type: string
                    label:
                      type: string
