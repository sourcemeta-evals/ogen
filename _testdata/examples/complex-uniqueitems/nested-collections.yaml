openapi: 3.0.3
info:
  title: Nested Collections UniqueItems Test
  version: 1.0.0
  description: |
    Integration test for uniqueItems validation on the item shapes that have
    no generated Equal/Hash fast path:
    - Arrays of arrays
    - Arrays of map-only objects (additionalProperties)
    - Arrays of nullable objects
    - Arrays of free-form values (no item schema)
    - Arrays of referenced free-form schemas (named raw JSON aliases)
    - Arrays of arrays whose elements are named raw JSON aliases
    - Arrays of arrays whose elements are named binary aliases
    - Arrays of arrays and maps whose values are free-form
    - Anonymous operation body arrays of objects
    - Object items with nested collection, raw JSON and float map fields

paths:
  /collections:
    post:
      operationId: createCollection
      summary: Create a collection exercising every fallback item shape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collection'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
  /grids/batch:
    post:
      operationId: addGridBatch
      summary: Anonymous request body array with unique inline object items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              uniqueItems: true
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer

components:
  schemas:
    Collection:
      type: object
      properties:
        grids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Grid'
        matrices:
          type: array
          uniqueItems: true
          items:
            type: array
            items:
              type: integer
        tagsets:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties:
              type: string
        maybes:
          type: array
          uniqueItems: true
          items:
            type: object
            nullable: true
            properties:
              id:
                type: string
              extra: {}
        anything:
          type: array
          uniqueItems: true
          items: {}
        freeMatrix:
          type: array
          uniqueItems: true
          items:
            type: array
            items: {}
        freeTagsets:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: {}
        annotations:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FreeForm'
        freeGrids:
          type: array
          uniqueItems: true
          items:
            type: array
            items:
              $ref: '#/components/schemas/FreeForm'
        blobMatrix:
          type: array
          uniqueItems: true
          items:
            type: array
            items:
              $ref: '#/components/schemas/Blob'
        records:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Record'
    Grid:
      type: object
      required:
        - id
        - scores
        - attachments
      properties:
        id:
          type: string
        matrix:
          type: array
          items:
            type: array
            items:
              type: integer
        labelsByGroup:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        weights:
          type: object
          additionalProperties:
            type: number
            format: double
        scores:
          type: object
          additionalProperties:
            type: number
            format: double
        attachments:
          type: object
          additionalProperties:
            type: object
            nullable: true
            properties:
              name:
                type: string
        link:
          type: string
          format: uri
        extra: {}
    Record:
      type: object
      required:
        - id
        - options
        - nilStatus
      properties:
        id:
          type: string
        options:
          $ref: '#/components/schemas/Options'
        nilStatus:
          $ref: '#/components/schemas/NilStatus'
    Options:
      type: object
      required:
        - retries
      properties:
        retries:
          type: integer
        verbose:
          type: boolean
    NilStatus:
      type: object
      required:
        - code
      properties:
        code:
          type: integer
        label:
          type: string
    FreeForm: {}
    Blob:
      type: string
      format: byte
